<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern1" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.2)"/>
    </pattern>
  </defs>
  <rect width="800" height="200" fill="url(#grad1)" rx="15"/>
  <rect width="800" height="200" fill="url(#pattern1)" rx="15">
    <animate attributeName="x" from="0" to="40" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">🚀 Awesome Store Audit Platform 📋</text>
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#f0f0f0">Curated List of SaaS &amp; Open-Source Audit Tools</text>
</svg>